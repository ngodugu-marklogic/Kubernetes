[project]
name = "ai-team-partner"
version = "0.1.0"
description = "AI team partner and scrum master API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "hyperforge",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35",
]

[tool.uv.sources]
# Project branch: https://github.com/nuclia/hyperforge/tree/execution-partner
hyperforge = { git = "https://github.com/nuclia/hyperforge.git", rev = "f93583228b914d6b764e50874308b44dc5655265", subdirectory = "hyperforge" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
team-partner-http = "team_partner.commands:run_api"

[tool.ruff]
line-length = 120
