services:
  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    cap_drop:
      - NET_RAW
    command: sh -lc "npm ci && npm run dev -- --port 4200 --host 0.0.0.0"
    ports:
      - '${FRONTEND_PORT:-4201}:4200'
    environment:
      BACKEND_PROXY_TARGET: http://backend:8888
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    cap_drop:
      - NET_RAW
    command: uv run --no-dev --no-sync team-partner-http
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8888
      DATABASE_URL: sqlite:////app/data/team_partner.db
    ports:
      - '${BACKEND_PORT:-8888}:8888'
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8888/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  backend_data:
